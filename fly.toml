app = "scene-wiki-runner"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "5m"

[build]
  dockerfile = "Dockerfile.runner"

[env]
  PLATFORM_BASE_URL = "https://scene-wiki-platform.founders-0e1.workers.dev"
  MAIN_DOMAIN = "scenewiki.net"
  PAGES_PROJECT_PREFIX = "scene-wiki"
  RUNNER_POLL_SECONDS = "20"
  SCENE_WIKI_EXTRACTION_BACKEND = "openai"
  SCENE_WIKI_ROOT = "/app"
  SCENE_WIKI_DATA_ROOT = "/data/scene-wiki-data"
  SCENE_WIKI_CHECKPOINT_DIR = "/data/archive-checkpoints"
  SCENE_WIKI_QUARTZ_CONCURRENCY = "1"
  SCENE_WIKI_NODE_MAX_OLD_SPACE_MB = "6144"
  RUNNER_WORKDIR = "/app"
  RUNNER_LOG_ROOT = "/data/logs"

[processes]
  app = "python3 scripts/platform_runner.py --env-file /app/.missing-env --workdir /app"

[[vm]]
  cpus = 1
  memory = "8gb"
  cpu_kind = "performance"

[[mounts]]
  source = "scene_wiki_data"
  destination = "/data"
